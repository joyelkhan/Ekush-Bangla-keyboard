# Ekush Privacy Guard CI Workflow (Blueprint Part 07.4 & Prompt 7)
# WHY: Ekush is an offline-first Bangla IME that promises ZERO internet access.
# Any PR introducing android.permission.INTERNET, unapproved permissions, or
# unapproved network libraries must fail CI immediately before merge.

name: Ekush Privacy Guard & Tests

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  privacy-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify zero INTERNET or unapproved permissions in manifests
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET, sys

          forbidden = {
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.ACCESS_WIFI_STATE",
          }
          allow = set()
          in_perms = False
          for line in pathlib.Path("allowlist.txt").read_text(encoding="utf-8").splitlines():
              s = line.strip()
              if not s or s.startswith("#"):
                  continue
              if s == "[permissions]":
                  in_perms = True
                  continue
              if s.startswith("["):
                  in_perms = False
                  continue
              if in_perms:
                  allow.add(s)

          for mf in pathlib.Path(".").rglob("AndroidManifest.xml"):
              if "build/intermediates/merged_manifest" in str(mf) or "/src/" in str(mf):
                  tree = ET.parse(mf)
                  for node in tree.findall(".//uses-permission"):
                      name = node.attrib.get("{http://schemas.android.com/apk/res/android}name", "")
                      if name in forbidden or (name and name not in allow):
                          print(f"PRIVACY VIOLATION in {mf}: {name}", file=sys.stderr)
                          sys.exit(1)
          print("Privacy manifest check PASSED: zero INTERNET or unapproved permissions.")
          PY

      - name: Verify zero network libraries in Gradle files
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          banned = ["retrofit", "okhttp", "ktor-client", "firebase", "gms:play-services", "volley", "cronet"]
          for gf in ["app/build.gradle.kts", "engine/build.gradle.kts"]:
              lines = pathlib.Path(gf).read_text(encoding="utf-8").splitlines()
              for idx, line in enumerate(lines, 1):
                  s = line.strip()
                  if s.startswith("//"):
                      continue
                  for b in banned:
                      if re.search(rf"\b{re.escape(b)}\b", s):
                          print(f"BANNED NETWORK LIB '{b}' active in {gf}:{idx}: {s}", file=sys.stderr)
                          sys.exit(1)
          print("Dependency allowlist check PASSED.")
          PY

      - name: Run Engine & App Unit/Robolectric Tests and Debug Build
        run: gradle :engine:test :app:testDebugUnitTest :app:assembleDebug

      - name: Re-verify merged debug manifest after Gradle build
        run: |
          if grep -E "android\.permission\.(INTERNET|ACCESS_NETWORK_STATE)" app/build/intermediates/merged_manifest/debug/processDebugMainManifest/AndroidManifest.xml; then
            echo "PRIVACY VIOLATION in merged manifest!"
            exit 1
          fi
