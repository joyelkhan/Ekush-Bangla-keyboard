# Ekush Privacy Guard & APK Build Workflow (Blueprint Part 07.4 & Prompt 7)
# WHY: Ekush is an offline-first Bangla IME that guarantees ZERO internet access.
# This workflow runs on every push/PR (and manual trigger), verifies zero network
# permissions/dependencies, runs all unit/Robolectric tests, builds Ekush-debug.apk,
# and uploads it as a downloadable GitHub Actions Artifact.

name: Ekush Privacy Guard & Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  privacy-tests-and-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify zero INTERNET or unapproved permissions in source manifests
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET, sys

          forbidden = {
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.ACCESS_WIFI_STATE",
          }
          allow = set()
          in_perms = False
          for line in pathlib.Path("allowlist.txt").read_text(encoding="utf-8").splitlines():
              s = line.strip()
              if not s or s.startswith("#"):
                  continue
              if s == "[permissions]":
                  in_perms = True
                  continue
              if s.startswith("["):
                  in_perms = False
                  continue
              if in_perms:
                  allow.add(s)

          for mf in pathlib.Path(".").rglob("AndroidManifest.xml"):
              if "/src/" in mf.as_posix():
                  tree = ET.parse(mf)
                  for node in tree.findall(".//uses-permission"):
                      name = node.attrib.get("{http://schemas.android.com/apk/res/android}name", "")
                      if name in forbidden or (name and name not in allow):
                          print(f"PRIVACY VIOLATION in {mf}: {name}", file=sys.stderr)
                          sys.exit(1)
          print("Source manifest privacy check PASSED.")
          PY

      - name: Verify zero network libraries in Gradle files
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          banned = ["retrofit", "okhttp", "ktor-client", "firebase", "gms:play-services", "volley", "cronet"]
          for gf in ["app/build.gradle.kts", "engine/build.gradle.kts"]:
              lines = pathlib.Path(gf).read_text(encoding="utf-8").splitlines()
              for idx, line in enumerate(lines, 1):
                  s = line.strip()
                  if s.startswith("//"):
                      continue
                  for b in banned:
                      if re.search(rf"\b{re.escape(b)}\b", s):
                          print(f"BANNED NETWORK LIB '{b}' active in {gf}:{idx}: {s}", file=sys.stderr)
                          sys.exit(1)
          print("Dependency allowlist check PASSED.")
          PY

      - name: Generate ephemeral debug.keystore for CI if absent
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run Engine & App Unit/Robolectric Tests and Build Debug APK
        run: gradle :engine:test :app:testDebugUnitTest :app:assembleDebug

      - name: Re-verify merged debug manifest after Gradle build
        run: |
          if grep -E "android\.permission\.(INTERNET|ACCESS_NETWORK_STATE)" app/build/intermediates/merged_manifest/debug/processDebugMainManifest/AndroidManifest.xml; then
            echo "PRIVACY VIOLATION in merged manifest!"
            exit 1
          fi
          echo "Merged manifest zero-network check PASSED."

      - name: Package Ekush-debug.apk artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk Ekush-debug.apk

      - name: Upload Ekush-debug.apk for download
        uses: actions/upload-artifact@v4
        with:
          name: Ekush-debug-apk
          path: Ekush-debug.apk
          if-no-files-found: error
